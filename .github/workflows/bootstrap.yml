name: Bootstrap Laravel Agent Fabric V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  publish-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Discover verified V2 archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/agent-fabric-v2 /tmp/candidates
          mkdir -p /tmp/agent-fabric-v2 /tmp/candidates

          try_candidate() {
            local name="$1"; shift
            echo "Trying candidate: $name => $*"
            local b64="/tmp/candidates/${name}.b64"
            local tgz="/tmp/candidates/${name}.tar.gz"
            : > "$b64"
            for f in "$@"; do
              test -f "$f" || return 1
              tr -d '\n\r' < "$f" >> "$b64"
            done
            base64 -d "$b64" > "$tgz" 2>/dev/null || return 1
            gzip -t "$tgz" 2>/dev/null || return 1
            rm -rf /tmp/candidate-extract
            mkdir -p /tmp/candidate-extract
            tar -xzf "$tgz" -C /tmp/candidate-extract 2>/dev/null || return 1
            test -f /tmp/candidate-extract/laravel-agent-fabric/composer.json || return 1
            local count
            count="$(find /tmp/candidate-extract/laravel-agent-fabric -type f | wc -l | tr -d ' ')"
            echo "Candidate $name file count: $count"
            test "$count" = "211" || return 1
            php /tmp/candidate-extract/laravel-agent-fabric/scripts/smoke.php
            cp -a /tmp/candidate-extract/laravel-agent-fabric/. /tmp/agent-fabric-v2/
            sha256sum "$tgz"
            echo "$name" > /tmp/agent-fabric-v2-candidate
            return 0
          }

          try_candidate c1 .bootstrap/v2-000.b64 .bootstrap/v2-001.b64 .bootstrap/v2-002.b64 .bootstrap/v2-003.b64 .bootstrap/v2-004.b64 .bootstrap/v2-005.b64 .bootstrap/v2-006.b64 || \
          try_candidate c2 .bootstrap/v2-000.b64 .bootstrap/v2-001.b64 .bootstrap/v2-002.b64 .bootstrap/v2-003.b64 .bootstrap/v2-004.b64 .bootstrap/v2-005.b64 .bootstrap/v2-006.b64 .bootstrap/v2-008.b64 || \
          try_candidate c3 .bootstrap/v2-000.b64 .bootstrap/v2-001.b64 .bootstrap/v2-002.b64 .bootstrap/v2-003.b64 .bootstrap/v2-004.b64 .bootstrap/v2-005.b64 .bootstrap/v2-008.b64 || \
          try_candidate c4 .bootstrap/v2-000.b64 .bootstrap/v2-001.b64 .bootstrap/v2-002.b64 .bootstrap/v2-003.b64 .bootstrap/v2-004.b64 .bootstrap/v2-005.b64 || \
          { echo 'No verified 211-file V2 archive candidate found.'; exit 1; }

          echo "Verified candidate: $(cat /tmp/agent-fabric-v2-candidate)"

      - name: Publish V2 source tree
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/agent-fabric-v2/. .
          rm -rf .bootstrap
          php scripts/smoke.php

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/*'

          if git diff --cached --quiet; then
            echo "No source changes to publish."
            exit 0
          fi

          git commit -m "feat: upgrade Laravel Agent Fabric to V2"
          git push origin HEAD:main
