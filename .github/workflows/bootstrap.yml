name: Publish Laravel Agent Fabric V2
# final verified publish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  publish-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Verify V2 patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap -maxdepth 1 -name 'patch-*.b64' | wc -l | tr -d ' ')" = "12"
          cat .bootstrap/patch-*.b64 | tr -d '\n\r' | base64 -d > /tmp/agent-fabric-v2.patch.tar.gz
          echo "d39adc6aa12d94ca32a4dba47643f8dcf2c18a262986ed8eec3ffb0cf63b45e5  /tmp/agent-fabric-v2.patch.tar.gz" | sha256sum -c -
          gzip -t /tmp/agent-fabric-v2.patch.tar.gz
          rm -rf /tmp/agent-fabric-v2-patch
          mkdir -p /tmp/agent-fabric-v2-patch
          tar -xzf /tmp/agent-fabric-v2.patch.tar.gz -C /tmp/agent-fabric-v2-patch
          test -f /tmp/agent-fabric-v2-patch/src/Workflow/WorkflowEngine.php
          test -f /tmp/agent-fabric-v2-patch/src/Protocols/MCP/LocalMcpServer.php
          test -f /tmp/agent-fabric-v2-patch/src/Protocols/A2A/LocalA2AGateway.php
          test -f /tmp/agent-fabric-v2-patch/src/Deployment/ReplayService.php

      - name: Apply and validate V2
        shell: bash
        run: |
          set -euo pipefail

          if test -s /tmp/agent-fabric-v2-patch/.deleted-files; then
            while IFS= read -r path; do
              test -z "$path" || rm -rf -- "$path"
            done < /tmp/agent-fabric-v2-patch/.deleted-files
          fi

          rm -f /tmp/agent-fabric-v2-patch/.deleted-files
          cp -a /tmp/agent-fabric-v2-patch/. .
          rm -rf .bootstrap

          php scripts/smoke.php
          test -f src/Workflow/WorkflowEngine.php
          test -f src/Protocols/MCP/LocalMcpServer.php
          test -f src/Protocols/A2A/LocalA2AGateway.php
          test -f src/Deployment/ReplayService.php

          count="$(find . -path './.git' -prune -o -type f -print | wc -l | tr -d ' ')"
          echo "Repository file count before workflow swap: $count"
          test "$count" = "211"

      - name: Commit V2 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/*'
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No source changes to publish."
            exit 0
          fi

          git commit -m "feat: upgrade Laravel Agent Fabric to V2"
          git push origin HEAD:main
